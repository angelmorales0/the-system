name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine-checks:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - run: scripts/lint-day-math.sh
      - run: scripts/engine-checks.sh
