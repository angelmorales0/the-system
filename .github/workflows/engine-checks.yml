name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine-checks:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - run: scripts/lint-extensions.sh
      - run: scripts/lint-day-math.sh
      - run: scripts/lint-shared-keys.sh
      - run: scripts/engine-checks.sh
  hevy-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tla2tools
          key: tla2tools-1.7.4
      - run: scripts/check-hevy-model.sh
